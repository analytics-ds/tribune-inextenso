baseURL = "https://tribune.inextenso.fr/"
title = "Tribune In Extenso"
theme = "tribune"

defaultContentLanguage = "fr"
defaultContentLanguageInSubdir = false

[languages]
  [languages.fr]
    languageCode = "fr-FR"
    languageName = "Français"
    contentDir = "content/fr"
    weight = 1
    title = "Tribune In Extenso"
    [languages.fr.params]
      description = "Le média d'In Extenso pour les dirigeants d'entreprise. Analyses, décryptages et regards d'experts sur la stratégie, la gestion, la finance, la fiscalité, le juridique et le développement. Entreprenez l'avenir."

  [languages.en]
    languageCode = "en-US"
    languageName = "English"
    contentDir = "content/en"
    weight = 2
    title = "Tribune In Extenso"
    [languages.en.params]
      description = "In Extenso's media for business leaders. Analysis, insights and expert views on strategy, management, finance, tax, legal and growth. Undertake the future."

[taxonomies]
  category = "categories"
  tag = "tags"

# Menu français
[[languages.fr.menus.main]]
  name = "Accueil"
  url = "/"
  weight = 1

[[languages.fr.menus.main]]
  name = "Décryptages"
  url = "/categories/decryptages/"
  weight = 2

[[languages.fr.menus.main]]
  name = "Réglementaire"
  url = "/categories/reglementaire/"
  weight = 3

[[languages.fr.menus.main]]
  name = "Prospective"
  url = "/categories/prospective/"
  weight = 4

[[languages.fr.menus.main]]
  name = "Regards d'experts"
  url = "/categories/regards-d-experts/"
  weight = 5

[[languages.fr.menus.main]]
  name = "Le Blog"
  url = "/blog/"
  weight = 99

# Menu anglais
[[languages.en.menus.main]]
  name = "Home"
  url = "/en/"
  weight = 1

[[languages.en.menus.main]]
  name = "Insights"
  url = "/en/categories/insights/"
  weight = 2

[[languages.en.menus.main]]
  name = "Regulatory"
  url = "/en/categories/regulatory/"
  weight = 3

[[languages.en.menus.main]]
  name = "Foresight"
  url = "/en/categories/foresight/"
  weight = 4

[[languages.en.menus.main]]
  name = "Expert Views"
  url = "/en/categories/expert-views/"
  weight = 5

[[languages.en.menus.main]]
  name = "The Blog"
  url = "/en/blog/"
  weight = 99

[params]
  # Couleurs In Extenso
  primary = "#000000"
  primary_light = "#33404c"
  primary_dark = "#000000"
  background = "#FFFFFF"
  background_alt = "#EFF4F6"
  accent = "#F58220"
  cta = "#F58220"
  cta_hover = "#D96F14"
  text = "#1A1A1A"
  text_light = "#4A5560"
  border = "#E3E9EE"

  # Polices
  font_heading = "Oswald"
  font_body = "Arimo"
  font_ui = "Oswald"

  # Métadonnées
  default_og_image = "/images/og-default.svg"
  logo = "/favicon.svg"
  founding_year = 1991
  expertise = ["Conseil aux entreprises", "Stratégie d'entreprise", "Gestion et pilotage", "Finance d'entreprise", "Fiscalité", "Droit des affaires", "Développement et transmission"]

  # Editeur (Organization JSON-LD) : In Extenso, la marque derriere la Tribune
  organization_name = "In Extenso"
  organization_url = "https://www.inextenso.fr/"
  organization_logo = "/images/logo-inextenso.png"
  organization_sameas = ["https://www.inextenso.fr/"]

[related]
  includeNewer = true
  threshold = 80
  [[related.indices]]
    name = "categories"
    weight = 100
  [[related.indices]]
    name = "tags"
    weight = 80

[markup]
  [markup.tableOfContents]
    startLevel = 2
    endLevel = 3
    ordered = false

[outputFormats]
  [outputFormats.sitemap]
    mediaType = "application/xml"
    baseName = "sitemap"

[sitemap]
  changefreq = "weekly"
  filename = "sitemap.xml"
  priority = -1
