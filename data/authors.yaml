# Auteurs de la Tribune In Extenso (multilingue FR/EN)
# Lu nativement par Hugo via `.Site.Data.authors` dans les templates.
# L'ID (slug) est utilise dans le frontmatter des articles : `author: camille-fabre`.
# `expertise` alimente le schema.org Person -> knowsAbout. `topics` sert a la selection auto dans /create-article.
# linkedinUrl : a renseigner quand les profils sociaux reels existent (alimente sameAs du Person schema).

camille-fabre:
  id: camille-fabre
  name: Camille Fabre
  type: person
  avatar: ""
  linkedinUrl: ""
  jobTitle:
    fr: Experte-comptable et conseil en gestion
    en: Chartered accountant and management advisor
  role:
    fr: Conseil finance, gestion et fiscalite
    en: Finance, management and tax advisor
  bio:
    fr: "Camille Fabre accompagne les dirigeants de TPE et PME sur la gestion, la tresorerie, la fiscalite et le pilotage de leur activite. Elle s'appuie sur l'expertise de terrain d'In Extenso pour traduire les sujets financiers et comptables en decisions concretes."
    en: "Camille Fabre supports the leaders of small and medium businesses on management, cash flow, taxation and business steering. She draws on In Extenso's field expertise to turn financial and accounting topics into concrete decisions."
  expertise:
    - Comptabilite
    - Fiscalite
    - Tresorerie
    - Pilotage d'entreprise
    - Gestion
    - Finance d'entreprise
  topics:
    - finance
    - tresorerie
    - fiscalite
    - tva
    - comptabilite
    - gestion
    - pilotage
    - rentabilite
    - budget
    - expert-comptable

